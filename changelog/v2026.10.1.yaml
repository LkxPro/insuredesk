version: v2026.10.1
date: 2026-10-28
entries:
  - category: 改进
    user: 工单地图改为按工单量热力着色，红点改在单市视图显示
    full: 工单地图的地区改为按工单量着色：全国视图按省、单省视图按市（直辖市按区县）、单市视图按区县，工单越多颜色越深，由浅粉渐变到深红，最深色对应当前视图中工单最多的地区，悬浮地区仍可看具体例数。红点改为只在单市视图显示，并加白色描边，在深色区域上也能看清；全国与单省视图不再画红点。要打开某地的工单列表，可双击进入单市视图后点击红点，或在排名卡片的区县行点「查看工单」。
    page: /ticket-map
    screenshot: ticket-map-heat.png
  - category: 内部
    user: 新增工单地图演示数据脚本
    full: 新增工单地图演示数据脚本（apps/api/prisma/seed-map-demo.ts，需手动执行）：按各省份权重生成带地址的演示工单，默认 3000 条，创建时间分布在近半年内；重跑时先删除上次生成的数据（以 MAPDEMO 标记识别）再重建，供演示与测试环境展示地图效果。应用功能与界面无变化。
