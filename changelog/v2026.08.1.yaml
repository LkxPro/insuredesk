version: v2026.08.1
date: 2026-08-14
entries:
  - category: 新增
    user: 创建/编辑工单时即时查重
    full: 录入保单号与手机号时即时提示疑似重复工单，提交时服务端再做 409 兜底，避免并发下建重单。
  - category: 新增
    user: 工单详情页提示该客户的其他工单
    full: 详情页顶部出现重复工单条幅：「该客户另有 N 个工单」，条目带最新处理时间与摘要，点击可跳转。
  - category: 新增
    user: 轻提示改为顶部胶囊队列
    full: 操作结果提示改为顶部居中胶囊依次排队，带关闭键、点击跳转到对应工单；按类别决定是否自动消失；弹窗打开时点击其他区域不再误关提示。
  - category: 改进
    user: 处理记录改为聊天式时间线
    full: 沟通记录按方向分左右气泡展示，完结节点收为细线里程碑，编辑历史可展开查看改动 diff。
  - category: 改进
    user: 派单时责任人候选只列可处理工单的用户
    full: 分配责任人时候选列表按「能处理工单」过滤，避免派给没有工单处理权限的账号。
  - category: 修复
    user: 外部工单新建对话框不再残留上次内容
    full: 外部账号新建工单的对话框重新打开时重置为空白表单与初始提交状态。
  - category: 内部
    user: agent loop 自动化代理上线
    full: 引入 GitHub issue 驱动的 agent loop 自动化代理：本地配置、失败分级、无父规格任务、heartbeat 容错与孤儿任务恢复、网络抖动误判修复，并把实施纪律与注释规范纳入流程。
  - category: 内部
    user: worktree 端口隔离泛化
    full: 任意 linked worktree 自动分配隔离的 db/api/web 端口（粘性分配、撞车自愈），lint 在 worktree 内可用。
