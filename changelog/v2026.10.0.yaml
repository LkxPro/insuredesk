version: v2026.10.0
date: 2026-10-20
entries:
  - category: 新增
    user: 新增「工单地图」页：在全国地图上一眼看清工单的地域分布
    full: 侧边栏新增「工单地图」入口，由新权限「工单地图」控制（默认仅管理员，可在角色管理中授予其他角色）。白底全国地图上，每张填了地址的工单在其区县位置显示为一个红点，同一区县的多张工单自动错开排布；支持滚轮缩放、拖拽平移，双击省份可进入单省视图查看市界分布，悬浮红点或省份显示对应工单数。页面可按创建时间（默认近 90 天）与用户反馈渠道筛选，实时显示「已定位 N 例」；点击红点跳转工单列表并自动按该地区过滤，列表上显示可移除的地区筛选标签。未填地址的工单不参与统计，没有全量工单查看权限的账号只统计自己可见的工单。
    page: /ticket-map
    screenshot: ticket-map.png
  - category: 新增
    user: 工单新增「地址」字段：省 / 市 / 区县三级级联选择，支持输入搜索
    full: 新建与编辑任一种类工单时可选填地址，省、市、区县逐级下拉，可输入文字快速搜索；地址要么不填、要么选到最后一级，未选完无法提交。详情页展示地址（如「广东省 深圳市 南山区」，直辖市为「北京市 朝阳区」），工单导出新增省、市、区县三列，开放数据分析 API 的工单接口同步返回地址区划码与名称，地址的新增与修改记入工单处理记录。
    page: /tickets/new
    screenshot: ticket-address.png
  - category: 内部
    user: 基础设施：数据湖新增逻辑复制（变更流）同步通道
    full: 生产数据库在只读直连之外新增逻辑复制通道：etl_ro 角色获得复制权限，发布覆盖工单域 12 张表白名单，消费方可订阅增量变更流替代定时轮询；后续新建表默认不进入复制流。应用功能与界面无变化。
