version: v2026.10.0
date: 2026-10-20
entries:
  - category: 新增
    user: 新增「工单地图」页：在全国地图上一眼看清工单的地域分布
    full: 侧边栏新增「工单地图」入口，由新权限「访问工单地图」控制（默认仅管理员，可在「角色权限」中授予其他角色）。白底全国地图上，每张填了地址的工单在其区县位置显示为一个红点，同一区县的多张工单自动错开排布；支持滚轮缩放、拖拽平移，双击省份进入单省视图、再双击市进入单市视图，逐级查看各市、各区县的分布，悬浮红点或地区显示对应工单数。页面可按创建时间（默认近 90 天）与用户反馈渠道筛选，实时显示「已定位 N 例」；点击红点跳转工单列表并自动按该地区过滤，列表上显示可移除的地区筛选标签。未填地址的工单不参与统计，没有全量工单查看权限的账号只统计自己可见的工单。
    page: /ticket-map
    screenshot: ticket-map.png
  - category: 新增
    user: 工单地图新增地区排名：按省、市、区县看工单量排行，支持搜索定位地区
    full: 工单地图左上角新增排名卡片，按省、市或区县列出各地区的工单数、占比与名次，前三名以金、银、铜色标出，数量相同则名次并列；可切换升序 / 降序，也可收起卡片，地区较多时显示前 100 名。排名层级跟随地图视图：全国视图可选省、市、区县，单省视图可选市、区县（直辖市只排区县），单市视图排区县。卡片顶部的地区搜索框支持中文（如「南京江宁」）、拼音全拼或首字母搜索，也可从省到区县逐级浏览选择；选中后地图自动进入对应的省或市视图，选的是区县时还会高亮该区县，排名中的对应行同步高亮。点击排名行同样可定位到对应地区；区县行悬浮时出现「查看工单」按钮，可直接打开该地区的工单列表（需「访问工单列表」权限）。
    page: /ticket-map
    screenshot: ticket-map-ranking.png
  - category: 新增
    user: 工单新增「地址」字段：省 / 市 / 区县三级级联选择，支持输入搜索
    full: 新建与编辑任一种类工单时可选填地址，省、市、区县逐级下拉，可输入文字快速搜索；地址要么不填、要么选到最后一级，未选完无法提交。详情页展示地址（如「广东省 深圳市 南山区」，直辖市为「北京市 朝阳区」），工单导出新增省、市、区县三列，开放数据分析 API 的工单接口同步返回地址区划码与名称，地址的新增与修改记入工单处理记录。
    page: /tickets/new
    screenshot: ticket-address.png
  - category: 内部
    user: 基础设施：数据湖新增逻辑复制（变更流）同步通道
    full: 生产数据库在只读直连之外新增逻辑复制通道：etl_ro 角色获得复制权限，发布覆盖工单域 12 张表白名单，消费方可订阅增量变更流替代定时轮询；后续新建表默认不进入复制流。应用功能与界面无变化。
