version: v2026.08.5
date: 2026-08-20
entries:
  - category: 新增
    user: 投诉渠道改为字典目录预设，告别自由填写
    full: 工单的「用户投诉渠道」「投诉信息接收渠道」从自由文本改为字典目录下拉选择，两个渠道目录随版本建好，可在字典管理中增改停用；存量工单按映射表自动归入目录，导入按名称解析且模板带下拉，导出与外部接口出参同步改用目录名。
    page: /tickets/new
    screenshot: ticket-channel-select.png
  - category: 新增
    user: 字典管理改版：卡片总览 + 抽屉维护，目录项支持拖拽与按名称排序
    full: 字典管理页改为每个目录一张卡片（条数徽标 + 前三项预览），点「管理」在右侧抽屉维护条目，页面长度不再随目录数量膨胀；条目顺序改为拖拽手柄或方向键调整，并可按名称拼音 A→Z/Z→A 预览排序，点「保存此顺序」才覆盖手动顺序。
    page: /dictionary
    screenshot: dictionary-catalogs.png
  - category: 改进
    user: 分配工单的责任人支持中文/拼音模糊搜索
    full: 分配、改派与批量分配工单时，责任人从长下拉列表改为搜索选择：支持中文、拼音全拼与首字母缩写模糊匹配，命中文字高亮，方向键导航、回车选中；候选人多时不再靠翻列表找人。
    page: /tickets
  - category: 改进
    user: 工单列表搜索框新增「搜索」按钮与一键清除
    full: 工单列表搜索框右侧新增「搜索」按钮，与回车等效提交；输入框内的清除钮一键同时撤掉未提交的输入与已生效的搜索，列表恢复全部。内外两端工单列表同步生效。
    page: /tickets
    screenshot: tickets-search.png
  - category: 内部
    user: 发布与本地开发工具稳定性改进
    full: 发版准备脚本对 GitHub 瞬态故障自动重试；make dev 复跑时自动回收上轮残留进程占用的端口；删除误提交的 Prisma 迁移副本。
