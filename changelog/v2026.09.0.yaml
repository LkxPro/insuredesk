version: v2026.09.0
date: 2026-09-02
entries:
  - category: 新增
    user: 新增「退费异常」工单：骏伯平台推送自动建单，完结后自动回传处理结果
    full: 骏伯保险平台推送的退费异常工单自动进入工单列表，来源标记为「骏伯保险平台」。详情页新增「退费信息」区块，展示工单类型、异常原因、应退金额、投保人与保单信息及期次明细；平台推送的实收字段只读锁定，补偿金可由有权限的客服填写修改。工单完结后系统自动向平台回传处理结果（加密传输、失败自动重试），详情页可查看回调投递状态，投递失败可一键重新投递。
    page: /tickets
    screenshot: refund-detail.png
  - category: 新增
    user: 时效策略按工单种类分组管理
    full: SLA 策略页改为按工单种类分组展示，各组独立排序与启停，新建策略须先选定种类；建单与编辑工单时，时效策略下拉只列出该工单种类的可用策略。「退费异常」种类内置一条默认策略。
    page: /sla
    screenshot: sla-kind-groups.png
  - category: 新增
    user: 字典管理新增「工单种类」目录
    full: 「字典管理」新增工单种类目录，支持新增种类、改名、停用与排序；绑定系统行为的种类（投诉、退费异常）只能停用，不可删除。
    page: /dictionary
    screenshot: dictionary-ticket-kind.png
  - category: 新增
    user: 工单列表支持按「种类」筛选
    full: 工单列表筛选栏新增「种类」多选筛选器，可只看投诉单或退费异常单；已停用的种类在选项中带标注，仍可用于筛出存量工单。
    page: /tickets
    screenshot: tickets-kind-filter.png
  - category: 新增
    user: 工单导出按种类拆分：Excel 双工作表、CSV 打包为 zip
    full: 不限定种类导出时，Excel 文件内含「投诉」「退费异常」两个工作表，CSV 改为 zip 包含两个文件；按单一种类筛选后导出仍为单表。退费异常导出列包含应退金额、投保人、保单号等专有字段，投诉导出列保持不变。
    page: /tickets
  - category: 新增
    user: 开放 API 在线文档
    full: API 服务新增 /docs 只读文档站，实时渲染当前 OpenAPI 契约，供对接方查阅工单推送与完结回调接口；仓库内有契约防漂移测试保证文档与实现一致。
  - category: 内部
    user: 部署联调与自动化工作流改进
    full: 测试环境新增一条命令更新（make upgrade-test）与配置变更后重建生效（make restart-test）；退费接口联调提供本地自测向导与回调加解密自测向量；数据库会话时区统一归正 UTC 并修正存量时间数据，应用层行为不变；CI 拆分为并行任务，整体耗时由约 5 分钟降至 2 分钟内；工单自动化流程修复发布前校验误判与工作丢失隐患。
