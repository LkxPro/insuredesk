version: v2026.11.0
date: 2026-11-06
entries:
  - category: 新增
    user: 支持接收汇付投诉并自动创建工单
    full: 配置汇付推送接入后，微信投诉和 400 消费者投诉可自动进入工单系统，来源显示为“汇付工单系统”。同一投诉的后续事件追加到已有工单并发送通知，重复推送不会重复建单；暂时处理失败的消息会保留并重试。微信投诉当前仅接收摘要，不包含历史补拉、详情查询或向汇付回复、完结回传。
  - category: 改进
    user: 汇付 400 投诉自动填写渠道与经纪主体
    full: 汇付 400 新工单自动填写反馈渠道“支付”、支付渠道“汇付”和接收渠道“汇付400工单投诉”，并按投诉来源匹配用户反馈渠道。商户名称唯一匹配凯森、东方大地或中融时填写对应经纪主体，无法确定时留空；后续推送不会覆盖客服修改。
  - category: 修复
    user: 汇付端点校验可正常完成，投诉附件不再保留
    full: 支持汇付控台的空对象端点校验，正式投诉推送仍需通过验签和商户白名单校验。收到的投诉附件不再保存、展示或下载，仅附件变化的重推不会新增事件或通知。已有部署需按接入文档在停用旧服务后清理历史附件，再启动新版；清理不会修改既有备份或导出文件。
  - category: 改进
    user: CSV 和 Excel 导出补充创建人
    full: 投诉、退费工单的 CSV 和 Excel 导出均在末尾新增“创建人”列。手工录入、文件导入和外部账号提交的工单显示创建账号的当前姓名，平台接入的工单显示来源名称，创建人缺失时留空；既有列顺序保持不变。
  - category: 内部
    user: 提高自动化检查的稳定性
    full: 修正启动测试清理子进程、限流测试依赖真实耗时，以及并发迁移修改共享数据库角色引起的偶发失败；降低前端测试并发，减少页面加载超时。保留既有断言和超时要求。
