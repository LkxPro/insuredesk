version: v2026.09.3
date: 2026-09-16
entries:
  - category: 新增
    user: 工单列表新增「创建人」列
    full: 工单管理列表在「来源」和「责任人」之间新增「创建人」列，不用逐条打开详情就能看到工单由谁创建。手工录入、文件导入、外部渠道提交的工单显示创建人的当前姓名；飞书、社区、骏伯平台接入的工单显示来源名称。
    page: /tickets
    screenshot: tickets-creator.png
  - category: 改进
    user: 工单列表隐藏保单号列
    full: 工单管理列表不再显示「保单号」列，客户姓名后直接展示渠道，为创建人等更常用的信息腾出空间。按保单号搜索与筛选、详情页与导出中的保单号均不受影响。
    page: /tickets
  - category: 内部
    user: 依赖例行升级
    full: 生产依赖按组升级 18 项，CI 的 setup-node 升级到 v7；自动化代理的沟通规范文档同步修订。应用功能与界面无变化。
