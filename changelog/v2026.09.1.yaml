version: v2026.09.1
date: 2026-09-04
entries:
  - category: 新增
    user: 数据看板重设计：行动区、时效策略条、渠道交叉矩阵、环比趋势与坐席考核一屏总览
    full: 数据看板自上而下重排为六区。「需要行动」实时汇总已超时、即将超时、待首响与未分配工单，点击数字直接下钻到工单列表；「时效策略」逐策略展示在途、超时与预警量；「渠道 × 用户反馈渠道」交叉矩阵支持数值、行占比、列占比三种口径并可展开实体明细；「单量趋势」按统计周期自动选择粒度，并与上一等长周期环比对照；「类型分布」呈现工单种类、类别与来源构成；「坐席负载与考核」把实时负载与周期内考核合并为一张表。统计周期控件悬浮于页面上方，默认近 30 天。
    page: /dashboard
    screenshot: dashboard-redesign.png
  - category: 新增
    user: 工单列表新增责任人、首响状态、时效策略三个筛选维度
    full: 工单列表筛选栏新增责任人多选、首响状态（可只看待首响）与时效策略多选（含「未指定」策略的工单），与看板下钻链接同一口径；三个维度同样适用于工单导出与开放 API 的工单查询。
    page: /tickets
    screenshot: tickets-filter-dimensions.png
  - category: 新增
    user: 开放数据分析 API：用 API key 自助拉取工单与处理日志明细
    full: 新增 /api/v1 开放接口：工单明细支持全量查询与增量同步（删除的工单带标记返回），处理日志、接口元信息与 OpenAPI 规格均可在线获取，/docs/analytics 提供接入文档。「个人资料」页可创建与管理自己的 API key（明文仅在创建成功时展示一次），管理员可在「用户管理」吊销任意账号的 key；接口调用按 key 限流并留存审计日志。
    page: /profile
    screenshot: profile-api-keys.png
  - category: 改进
    user: 退费工单详情页改版：客户与补偿信息一区汇总，退费信息改为账簿式键值行
    full: 退费异常工单详情页新增「客户与补偿」区，投保人、手机号码、备用电话与补偿金集中展示，补偿金与备用电话支持行内编辑；「退费信息」改为账簿式键值行，保单号等长单号使用等宽字体并可一键复制，同时修复了长单号溢出格子与相邻文字重叠、补偿金输入框被挤压只剩两个字符宽的问题。
    page: /tickets
    screenshot: refund-layout.png
  - category: 内部
    user: 工单自动化代理与发版流程加固
    full: 工单自动化代理经真实使用验证修复 8 处问题，全量检查（make check）耗时由 155 秒降至 53 秒；发版准备流程编入人工检查点与迭代降本指引，脚本修复路由 diff 缺 tag 与重试判定的问题。
