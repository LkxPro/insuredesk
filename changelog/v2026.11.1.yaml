version: v2026.11.1
date: 2026-11-09
entries:
  - category: 新增
    user: 录入工单时可关联已有工单并追加内部备注
    full: 手动录入时，系统按投保人电话、联系人电话或保单号匹配可关联的未完结工单。命中后不能重复新建，可打开原工单查看详情和历史沟通，选择一条追加仅内部可见的补充备注；备注不改变工单状态、联系次数或下次联系时间。角色新增“跨范围关联并追加备注”权限，开启后即使不能查看全部工单，也能关联他人工单；普通列表范围不变。管理员自动拥有，普通角色需手动授权。未分配工单也可追加，已完结或已删除工单不参与关联。
    page: /tickets/new
    screenshot: related-ticket-note.png
  - category: 改进
    user: 保单号输入取消“无保单号”勾选框
    full: 新增与编辑工单时，保单号区域只保留输入框，是否必填仍遵循角色配置。历史上标记为“无保单号”的工单也可直接补填，保存时清除旧标记。
    page: /tickets/new
    screenshot: policy-number-input.png
