# Release notes 按 PR label 分组（`gh release create --generate-notes` 读取）。
# 未打 label 的 PR 落入"其他"。
changelog:
  categories:
    - title: 新功能
      labels:
        - enhancement
    - title: 修复
      labels:
        - bug
    - title: 文档
      labels:
        - documentation
    - title: 其他
      labels:
        - "*"
