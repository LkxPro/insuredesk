name: setup-node-pnpm
description: pnpm onto PATH, then node from .nvmrc with pnpm store cache
runs:
  using: composite
  steps:
    # pnpm is not preinstalled on the runner, and setup-node's `cache: pnpm`
    # shells out to `pnpm store path` — so pnpm has to land on PATH first.
    - uses: pnpm/action-setup@v6
    - uses: actions/setup-node@v7
      with:
        node-version-file: .nvmrc
        cache: pnpm
