name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 显式超时是自愈前提:挂死(如 Docker Hub 限流拉镜像)会变 failure 触发
  # agent-pr-health 回队修复;不设超时则默认 6 小时,自动合并干等。
  lint-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      # pnpm is not preinstalled on the runner, and setup-node's `cache: pnpm`
      # shells out to `pnpm store path` — so pnpm has to land on PATH first.
      # Version comes from the packageManager field, same as local dev.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install + lint + typecheck + build + test
        run: sh scripts/ci.sh

  # Build the production image with the same context/Dockerfile as the Release
  # workflow. Pushes to main additionally publish the test channel
  # (:test + :test-<shortsha>) that the staging stack pulls — decoupled from
  # releases. PRs only build (no GHCR login on untrusted refs): a broken image
  # turns the PR red instead of surfacing at deploy time.
  docker-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write # main 推送 GHCR test 通道;PR 上不登录也不推送
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Short SHA
        id: meta
        run: echo "short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Build production image (push test tags on main)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/api/Dockerfile
          push: ${{ github.event_name == 'push' }}
          tags: |
            ghcr.io/lkxpro/insuredesk-api:test
            ghcr.io/lkxpro/insuredesk-api:test-${{ steps.meta.outputs.short }}
          build-args: |
            APP_VERSION=test-${{ steps.meta.outputs.short }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
