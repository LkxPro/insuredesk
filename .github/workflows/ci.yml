name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # The checks bind-mount the pnpm store to this repo-local path, so
      # caching it here carries it across runs.
      - name: Cache pnpm store
        uses: actions/cache@v6
        with:
          path: .pnpm-store
          key: pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-store-

      # One-shot container on the same dev compose service/image as local
      # development — Node/pnpm versions live in the image tag and the
      # packageManager field, never in this file.
      - name: Install + lint + typecheck + build + test
        run: >
          docker compose run --rm --no-deps -T
          -v "$PWD/.pnpm-store:/app/.pnpm-store"
          api sh scripts/ci.sh

  # Build the production image with the same context/Dockerfile as the Release
  # workflow, but never push: a broken image turns the PR red instead of
  # surfacing at release time.
  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Build production image (no push)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/api/Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
