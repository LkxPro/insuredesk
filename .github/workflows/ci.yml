name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 显式超时是自愈前提:挂死(如 Docker Hub 限流拉镜像)会变 failure 触发
  # agent-pr-health 回队修复;不设超时则默认 6 小时,自动合并干等。
  lint-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      # pnpm is not preinstalled on the runner, and setup-node's `cache: pnpm`
      # shells out to `pnpm store path` — so pnpm has to land on PATH first.
      # Version comes from the packageManager field, same as local dev.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install + lint + typecheck + build + test
        run: sh scripts/ci.sh

  # Build the production image with the same context/Dockerfile as the Release
  # workflow, but never push: a broken image turns the PR red instead of
  # surfacing at release time.
  docker-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Build production image (no push)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/api/Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
