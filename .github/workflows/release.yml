name: Release

# 一键发版（ADR 0009）：手动触发即算出下一个 CalVer 号、构建推送生产镜像、
# 打 tag 并创建 GitHub Release。操作手册见 docs/releasing.md。
on:
  workflow_dispatch:

# 串行发版：并发运行会算出同一个版本号后互相踩踏。
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write # 打 tag、创建 Release
  packages: write # 推送 GHCR 镜像

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Ensure releasing from main
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::Releases must be cut from main (got ${{ github.ref }})"
          exit 1

      - uses: actions/checkout@v7

      # 版本号以远端 tag 为唯一事实来源（ls-remote 不受 checkout 深度影响）：
      # 当月首个版本序号为 0，同月再发递增末位。月份按 Asia/Shanghai 计算。
      - name: Compute next CalVer tag
        id: version
        shell: bash # 显式 bash 才带 -o pipefail：ls-remote 失败必须炸，否则会算出 .0 覆盖已有版本
        run: |
          ym="$(TZ=Asia/Shanghai date +%Y.%m)"
          last="$(git ls-remote --tags origin "refs/tags/v${ym}.*" \
            | sed -n "s#.*refs/tags/v${ym}\.\([0-9][0-9]*\)\$#\1#p" \
            | sort -n | tail -1)"
          if [ -z "$last" ]; then n=0; else n=$((last + 1)); fi
          tag="v${ym}.${n}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Next release: $tag"

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 先推镜像、后打 tag：构建失败时不留下无镜像的 tag/Release，
      # 修复后重跑会重新算出同一个版本号。
      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: ghcr.io/lkxpro/insuredesk-api:${{ steps.version.outputs.tag }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.version.outputs.tag }}

      # --generate-notes 按 PR 生成 notes，.github/release.yml 定义 label 分组。
      - name: Create tag and GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.version.outputs.tag }}" \
            --target "$GITHUB_SHA" \
            --generate-notes
