name: Agent merge

on:
  pull_request:
    types: [opened, reopened, synchronize, labeled, ready_for_review]

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: agent-merge-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  # 同步等检查再 merge：GITHUB_TOKEN 触发的 auto-merge 完成事件不再触发 workflow,
  # 依赖 closed 事件的关单兜底永远不会执行,关单必须与 merge 同 job 完成。
  merge-and-close:
    if: contains(github.event.pull_request.labels.*.name, 'agent:automerge') && !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      PR: ${{ github.event.pull_request.number }}
      REPO: ${{ github.repository }}
    steps:
      - name: Wait for checks, squash merge, close linked issues
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -e
          # 传输层抖动(5xx/TLS)重试 5 次,指数退避;确定性失败由 gh 非零退出照旧暴露。
          retry() {
            n=0
            until "$@"; do
              n=$((n + 1)); [ "$n" -ge 5 ] && return 1
              sleep $((n * 20))
            done
          }
          # 本 job 自身就是 PR 上的一个 check,等全部 checks 等于等自己,必须排除。
          # synchronize 瞬间 CI 的 check-run 可能还没注册:空列表不是"全过",必须继续等。
          # gh api 传输失败按"还没好"处理:30 分钟 job 预算是天然上限,挂了重等比重跑省 CI。
          while :; do
            runs=$(gh api "repos/$REPO/commits/$HEAD_SHA/check-runs" \
              --jq '[.check_runs[] | select(.name != "merge-and-close")]' 2>/dev/null) || runs=""
            printf '%s' "$runs" | jq -e . >/dev/null 2>&1 || runs="[]"
            total=$(printf '%s' "$runs" | jq 'length')
            pending=$(printf '%s' "$runs" | jq '[.[] | select(.status != "completed")] | length')
            failed=$(printf '%s' "$runs" | jq '[.[] | select(.status == "completed" and (.conclusion | IN("success","skipped","neutral") | not))] | length')
            [ "$failed" -eq 0 ] || { echo "checks failed"; exit 1; }
            [ "$pending" -eq 0 ] && [ "$total" -gt 0 ] && break
            sleep 15
          done
          retry gh pr merge "$PR" --repo "$REPO" --squash --delete-branch
          gh pr view "$PR" --repo "$REPO" --json body --jq .body \
            | grep -Eio '(close[sd]?|fix(e[sd])?|resolve[sd]?) #[0-9]+' \
            | grep -Eo '[0-9]+' | sort -u | while read -r issue; do
              gh issue close "$issue" --repo "$REPO" || true
            done
