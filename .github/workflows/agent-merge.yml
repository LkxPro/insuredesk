name: Agent merge

on:
  pull_request:
    types: [opened, reopened, synchronize, labeled, ready_for_review]

permissions:
  contents: write
  pull-requests: write

jobs:
  enable-auto-merge:
    if: contains(github.event.pull_request.labels.*.name, 'agent:automerge') && !github.event.pull_request.draft
    runs-on: ubuntu-latest
    steps:
      - name: Queue squash merge after required checks pass
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh pr merge '${{ github.event.pull_request.number }}' --repo '${{ github.repository }}' --auto --squash --delete-branch
