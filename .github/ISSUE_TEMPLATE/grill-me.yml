name: Grill Me
description: Clarify product or technical decisions with a human.
title: "Grill: "
labels: [needs-triage]
body:
  - type: markdown
    attributes:
      value: |
        This is the only human interaction stage. Once the decisions are confirmed, apply `decision-confirmed`; the agent loop creates and executes the implementation tickets.
  - type: textarea
    id: outcome
    attributes:
      label: Outcome to decide
      description: What must be true after the work is done?
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Context and constraints
      description: Existing behaviour, non-goals, risks, and relevant links.
    validations:
      required: true
  - type: textarea
    id: decisions
    attributes:
      label: Confirmed decisions
      description: Fill during Grill Me. Apply `decision-confirmed` only when this is final.
    validations:
      required: true
