name: Agent task
description: Explicit fast lane for a complete implementation ticket that needs no design decision.
title: "Task: "
labels: [needs-triage]
body:
  - type: markdown
    attributes:
      value: Use this fast lane only when no Grill Me decision remains. All fields are required so dependency-free tasks can dispatch safely in parallel.
  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: User-visible outcome and why it matters.
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope
      description: Files/areas to change, non-goals, and constraints.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: One observable checkbox per required outcome.
      value: "- [ ] "
    validations:
      required: true
  - type: textarea
    id: touch-set
    attributes:
      label: Declared touch-set
      description: One repository-relative file or glob per line. Parallel tickets must not overlap unless ordered by a dependency.
      placeholder: "apps/api/src/services/**"
    validations:
      required: true
  - type: textarea
    id: logical-locks
    attributes:
      label: Logical locks
      description: Shared contracts, schemas, or migrations this ticket owns. Use `None` when empty.
      value: "- None"
    validations:
      required: true
  - type: textarea
    id: dependencies
    attributes:
      label: Dependencies
      description: Native issue dependencies. Use `None` when independent.
      value: "- None"
    validations:
      required: true
  - type: textarea
    id: test-plan
    attributes:
      label: Test plan
      description: Focused checks that prove each acceptance criterion.
    validations:
      required: true
