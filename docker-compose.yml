# InsureDesk development database. The API and web frontend run on the host
# (via `make dev`); only Postgres is containerized.
# Usage: make dev (first time will install deps, migrate, seed, start services)

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: insuredesk
      POSTGRES_PASSWORD: insuredesk_dev
      POSTGRES_DB: insuredesk
      TZ: Asia/Shanghai
      PGTZ: Asia/Shanghai
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U insuredesk"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
