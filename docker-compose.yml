# InsureDesk fully containerized development environment — everything (deps,
# db, api, web) runs in containers; the host only needs Docker.
# Usage: docker compose up (first time will install deps, migrate, seed)

services:
  # Dependency installer - runs once, idempotent by lockfile hash
  install:
    image: node:22-alpine
    working_dir: /app
    volumes:
      - .:/app
      - pnpm-store:/app/.pnpm-store
    environment:
      - CI=true
      - PNPM_HOME=/app/.pnpm-store
      - NPM_CONFIG_REGISTRY=${NPM_CONFIG_REGISTRY:-https://registry.npmjs.org}
    command: >
      sh -c "
        corepack enable &&
        pnpm config set store-dir /app/.pnpm-store &&
        pnpm install --frozen-lockfile
      "

  # PostgreSQL with healthcheck
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: insuredesk
      POSTGRES_PASSWORD: insuredesk_dev
      POSTGRES_DB: insuredesk
      TZ: Asia/Shanghai
      PGTZ: Asia/Shanghai
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U insuredesk"]
      interval: 5s
      timeout: 3s
      retries: 10

  # API service with hot reload
  api:
    image: node:22-alpine
    working_dir: /app
    depends_on:
      install:
        condition: service_completed_successfully
      db:
        condition: service_healthy
    ports:
      - "${API_PORT:-3000}:3000"
    volumes:
      - .:/app
      - pnpm-store:/app/.pnpm-store
      - /var/run/docker.sock:/var/run/docker.sock
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - DATABASE_URL=postgresql://insuredesk:insuredesk_dev@db:5432/insuredesk
      - SESSION_SECRET=dev_insecure_secret_change_in_production
      - NODE_ENV=development
      - PRISMA_ENGINES_MIRROR=${PRISMA_ENGINES_MIRROR:-}
    command: >
      sh -c "
        corepack enable &&
        pnpm config set store-dir /app/.pnpm-store &&
        cd apps/api &&
        pnpm prisma migrate deploy &&
        pnpm prisma db seed &&
        pnpm dev
      "

  # Web service with hot reload on 5173
  web:
    image: node:22-alpine
    working_dir: /app
    depends_on:
      install:
        condition: service_completed_successfully
      api:
        condition: service_started
    ports:
      - "${WEB_PORT:-5173}:5173"
    volumes:
      - .:/app
      - pnpm-store:/app/.pnpm-store
    environment:
      - NODE_ENV=development
      - VITE_API_URL=${VITE_API_URL:-http://api:3000}
    command: >
      sh -c "
        corepack enable &&
        pnpm config set store-dir /app/.pnpm-store &&
        cd apps/web &&
        pnpm dev --host
      "

volumes:
  postgres_data:
  pnpm-store:
